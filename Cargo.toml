[package]
name = "openremote"
version = "0.2.0"
edition = "2021"
description = "Use your phone as a touchpad, keyboard and remote for your PC"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"
png = "0.17"
rand = "0.8"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_System_WinRT"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
tray-icon = { version = "0.21", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_Security_Authorization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
