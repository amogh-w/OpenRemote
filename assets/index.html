<title>OpenRemote</title>
<script>
// Pick the Catppuccin flavor before first paint (same rule as paintSettings below).
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('or_settings') || '{}'), t = s.theme || 'auto';
    var map = { light: 'latte', dark: 'mocha' }; t = map[t] || t;
    var f = ['latte', 'frappe', 'macchiato', 'mocha'].indexOf(t) >= 0 ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte');
    document.documentElement.className = f;
    var a = { green: 'green', blue: 'blue', purple: 'mauve', orange: 'peach' }[s.accent] || s.accent;
    if (a) document.documentElement.dataset.accent = a;
  } catch (e) {}
})();
</script>

<style>

  --ctp-crust: #11111b;
}

/* ---- app tokens: every color below is a Catppuccin role (see docs/theme-config.md) ---- */
html {
  --bg: var(--ctp-base);          /* page */
  --surface: var(--ctp-mantle);   /* sunken panels: keyboard/tab area */
  --key: var(--ctp-surface0);     /* raised keys and buttons */
  --kt: var(--ctp-text);
  --ks: var(--ctp-crust);         /* key bottom edge */
  --dim: var(--ctp-subtext0);     /* captions, labels */
  --icon: var(--ctp-overlay1);    /* muted chrome: inactive tab icons */
  --line: var(--ctp-surface0);
  --edge: var(--ctp-surface1);
  --ac: var(--ctp-blue);          /* primary action, focus, active item */
  --on-ac: var(--ctp-base);       /* text on a solid accent */
  --danger: var(--ctp-red);
  --ok: var(--ctp-green);
}
html.latte { --ks: var(--ctp-surface2); }
html[data-accent=mauve] { --ac: var(--ctp-mauve); }
html[data-accent=pink]  { --ac: var(--ctp-pink); }
html[data-accent=peach] { --ac: var(--ctp-peach); }
html[data-accent=green] { --ac: var(--ctp-green); }
html[data-accent=teal]  { --ac: var(--ctp-teal); }

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--kt); font:16px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; overflow:hidden; }
button { font:inherit; color:inherit; border:0; background:none; padding:0; touch-action:manipulation; cursor:pointer; }
svg.i { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

#app { display:flex; flex-direction:column; height:100dvh; max-width:1000px; margin:0 auto; }
#top { flex:1; min-height:0; display:flex; flex-direction:column; padding:max(8px,env(safe-area-inset-top)) 10px 0; }
#padbox { position:relative; flex:1; min-height:90px; border-radius:20px; overflow:hidden; box-shadow:0 0 0 1px var(--edge); }
#pad { position:absolute; inset:0; touch-action:none;
  background: radial-gradient(110% 90% at 12% 92%, color-mix(in srgb, var(--ctp-text) 9%, transparent) 0, transparent 52%),
              linear-gradient(145deg, color-mix(in srgb, var(--ac) 40%, var(--ctp-base)), color-mix(in srgb, var(--ac) 12%, var(--ctp-crust))); }

#picker { position:absolute; z-index:3; left:10px; right:10px; top:10px; height:42px; display:flex; align-items:center; gap:10px; padding:0 12px;
  border-radius:12px; background:color-mix(in srgb, var(--ctp-crust) 72%, transparent); color:var(--ctp-text); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); font-size:14px; }
#picker .name { flex:1; text-align:left; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
#dot { width:9px; height:9px; border-radius:50%; background:var(--danger); flex:none; box-shadow:0 0 0 2px color-mix(in srgb, var(--ctp-text) 22%, transparent); }
#dot.ok { background:var(--ok); }
#hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ctp-subtext0); font-size:14px; text-align:center; pointer-events:none; padding:60px 70px 20px 20px; line-height:1.6; }
#strip { position:absolute; z-index:2; right:8px; top:60px; bottom:12px; width:38px; border-radius:19px; background:color-mix(in srgb, var(--ctp-text) 12%, transparent); touch-action:none; color:var(--ctp-overlay2); display:flex; flex-direction:column; justify-content:space-between; align-items:center; padding:6px 0; }
#modpill { position:absolute; z-index:2; left:12px; bottom:10px; background:var(--ctp-crust); color:var(--ctp-text); border:1px solid var(--edge); border-radius:12px; padding:4px 10px; font-size:13px; display:none; }

#btns { display:grid; grid-template-columns:5fr 1.2fr 5fr; gap:6px; height:58px; margin:8px 0 6px; flex:none; }
#btns button { border-radius:10px; background:var(--key); border:1.5px solid var(--ac); }
#btns button:active, #btns button.down { background:var(--ac); }

#bottom { flex:none; display:flex; flex-direction:column; background:var(--surface); border-top:1px solid var(--ctp-crust); }
#tabs { display:flex; overflow-x:auto; scrollbar-width:none; padding:0 4px; flex:none; }
#tabs::-webkit-scrollbar { display:none; }
#tabs button { flex:1 0 54px; height:46px; display:flex; align-items:center; justify-content:center; color:var(--icon); position:relative; }
#tabs button:hover { color:var(--ctp-overlay2); }
#tabs button.on { color:var(--ac); }
#tabs button.on::after { content:""; position:absolute; bottom:4px; width:18px; height:3px; border-radius:2px; background:var(--ac); }
#panel { height:clamp(230px,38dvh,340px); overflow-y:auto; padding:8px 10px calc(10px + env(safe-area-inset-bottom)); }
.pane[hidden] { display:none !important; }

.k { background:var(--key); color:var(--kt); border-radius:7px; box-shadow:0 1px 0 var(--ks); min-height:42px; display:flex; align-items:center; justify-content:center; font-size:19px; flex:1; min-width:0; transition:transform .04s; }
.k:active, .k.on { background:var(--ac); color:var(--on-ac); transform:translateY(1px); }
.k.small { font-size:13px; }
.k.red { color:var(--danger); }
.krow { display:flex; gap:5px; margin-bottom:6px; }
#p-kbd .krow { margin-bottom:7px; }
#p-kbd .k { min-height:min(44px,6.2dvh); }
.w15{flex:1.5}.w2{flex:2}.w5{flex:5}.w14{flex:1.4}

.grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
.grid4 .k { font-size:14px; min-height:44px; }
.row { display:flex; gap:6px; margin-bottom:6px; }
.lbl { font-size:12px; color:var(--dim); margin:6px 2px 4px; }
#p-remote { display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
.dial { position:relative; width:190px; height:190px; border-radius:50%; background:var(--key); box-shadow:0 1px 0 var(--ks), inset 0 0 0 1px var(--edge); flex:none; }
.dial button { position:absolute; width:46px; height:46px; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:26px; }
.dial button:active { background:var(--ac); color:var(--on-ac); }
.dial .c { left:55px; top:55px; width:80px; height:80px; box-shadow:inset 0 0 0 1.5px var(--ac); color:var(--ac); }
.dial .c:active { color:var(--on-ac); }
.dial .t { left:72px; top:8px; } .dial .b { left:72px; bottom:8px; } .dial .l { left:8px; top:72px; } .dial .r { right:8px; top:72px; }
.side { display:flex; flex-direction:column; gap:10px; }
.side .k { width:56px; flex:none; height:56px; border-radius:50%; }
.url { display:flex; gap:6px; margin-top:8px; }
.url input, textarea.field { flex:1; min-width:0; background:var(--key); color:var(--kt); border:1px solid var(--edge); border-radius:8px; padding:10px; font:inherit; font-size:15px; user-select:text; -webkit-user-select:text; }
::placeholder { color:var(--ctp-overlay1); opacity:1; }
textarea.field { width:100%; min-height:76px; resize:none; }
.url button, .btn { background:var(--ac); color:var(--on-ac); border-radius:8px; padding:0 16px; min-height:42px; font-weight:600; }
.pwr { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.pwr button { display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 6px; font-size:14px; border-radius:12px; background:var(--key); box-shadow:0 1px 0 var(--ks); }
.pwr button.arm { background:var(--danger); color:var(--on-ac); }
.pwr svg.i { width:30px; height:30px; }
.clipbtns { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
.clipbtns button { display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 6px; font-size:13px; border-radius:12px; background:var(--key); box-shadow:0 1px 0 var(--ks); }
.clipbtns svg.i { width:32px; height:32px; color:var(--ac); }
#clipmsg { font-size:12px; color:var(--dim); margin:4px 2px; min-height:16px; }
.keys2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.fr { display:flex; gap:5px; overflow-x:auto; margin-top:6px; padding-bottom:4px; scrollbar-width:none; }
.fr .k { flex:0 0 46px; font-size:13px; }

.set { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:15px; }
.set.col { flex-direction:column; align-items:stretch; gap:8px; }
.seg { display:flex; background:var(--key); border-radius:8px; overflow:hidden; box-shadow:0 1px 0 var(--ks); }
.seg button { flex:1; padding:8px 4px; font-size:12.5px; } .seg button.on { background:var(--ac); color:var(--on-ac); font-weight:600; }
.sw { display:flex; gap:10px; } .sw button { width:26px; height:26px; border-radius:50%; border:2px solid transparent; }
.sw button.on { border-color:var(--ctp-text); }
input[type=range] { accent-color:var(--ac); width:140px; }
.tog { width:46px; height:28px; border-radius:14px; background:var(--ctp-surface1); position:relative; flex:none; }
.tog::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--ctp-overlay1); transition:.15s; }
.tog.on { background:var(--ac); } .tog.on::after { left:21px; background:var(--on-ac); }

#pickscr { position:fixed; inset:0; z-index:10; background:var(--bg); display:none; flex-direction:column; padding:max(12px,env(safe-area-inset-top)) 16px 16px; }
#pickscr.show { display:flex; }
#pickscr header { display:flex; align-items:center; justify-content:space-between; height:44px; font-size:17px; }
#pickscr header button { color:var(--ac); width:44px; height:44px; display:flex; align-items:center; justify-content:center; }
.comp { display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); font-size:16px; }
.comp .nm { flex:1; min-width:0; } .comp small { display:block; color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.comp svg.i { color:var(--ac); } .comp .x { color:var(--icon); width:36px; height:36px; display:flex; align-items:center; justify-content:center; }
.comp.cur .nm { font-weight:600; }
#addbox { display:none; gap:8px; margin:10px 0; } #addbox.show { display:flex; }
#addbox input { flex:1; min-width:0; background:var(--key); color:var(--kt); border:1px solid var(--edge); border-radius:8px; padding:12px; font:inherit; font-size:15px; user-select:text; -webkit-user-select:text; }
#pickmsg { color:var(--dim); font-size:13px; margin:6px 0; line-height:1.5; }

.apps-top { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.apps-top .seg { flex:1; }
.apps-top input { flex:1; min-width:0; background:var(--key); color:var(--kt); border:1px solid var(--edge); border-radius:8px; padding:8px 10px; font:inherit; font-size:14px; user-select:text; -webkit-user-select:text; }
.win { display:flex; align-items:center; gap:10px; padding:6px 4px; border-radius:10px; }
.win.fg { background:color-mix(in srgb, var(--ac) 18%, transparent); }
.win.min { opacity:.6; }
.win img { width:32px; height:32px; flex:none; object-fit:contain; }
.win .ti { flex:1; min-width:0; }
.win .ti b { display:block; font-weight:500; font-size:14px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.win .ti small { color:var(--dim); font-size:11px; }
.win .acts { display:flex; gap:4px; }
.win .acts button { width:34px; height:34px; border-radius:8px; background:var(--key); display:flex; align-items:center; justify-content:center; }
.win .acts button svg.i { width:18px; height:18px; }
.win .acts button.x { color:var(--danger); }
#appgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.app { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px; border-radius:10px; font-size:11px; text-align:center; }
.app:active { background:var(--key); }
.app img { width:44px; height:44px; object-fit:contain; }
.app span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.2; max-width:100%; word-break:break-word; }
#appsmsg { font-size:12px; color:var(--dim); text-align:center; padding:10px 0; min-height:16px; }
#kb { position:fixed; left:-1000px; top:0; width:10px; height:10px; opacity:0; }

@media (orientation:landscape) and (max-height:520px) {
  #app { flex-direction:row; }
  #top { flex:1.05; padding-bottom:8px; }
  #bottom { flex:1; border-top:0; border-left:1px solid var(--ctp-crust); padding-top:max(4px,env(safe-area-inset-top)); }
  #panel { flex:1; height:auto; padding-bottom:8px; }
  #p-kbd .k { min-height:34px; }
}
</style>
</head>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // ---------- settings
  const S = Object.assign({ theme: 'auto', accent: 'blue', speed: 15, scroll: 3, natural: true, haptics: true }, store.get('or_settings', {}));
  // settings saved by older versions
  S.theme = { light: 'latte', dark: 'mocha' }[S.theme] || S.theme;
  S.accent = { purple: 'mauve', orange: 'peach' }[S.accent] || S.accent;
  const FLAVORS = ['latte', 'frappe', 'macchiato', 'mocha'];
  const flavor = () => (FLAVORS.includes(S.theme) ? S.theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte');
  const saveS = () => store.set('or_settings', S);
  const buzz = () => { if (S.haptics && navigator.vibrate) navigator.vibrate(8); };
  function paintSettings() {
    const root = document.documentElement;
    root.classList.remove(...FLAVORS); root.classList.add(flavor());
    root.dataset.accent = S.accent;
    const m = document.querySelector('meta[name=theme-color]');
    if (m) m.content = getComputedStyle(root).getPropertyValue('--ctp-base').trim() || m.content;
    $$('#s-theme button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.theme));
    $$('#s-accent button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.accent));
    $('#s-speed').value = S.speed; $('#s-scroll').value = S.scroll;
    $('#s-natural').classList.toggle('on', S.natural); $('#s-haptics').classList.toggle('on', S.haptics);
  }
  $('#s-theme').onclick = (e) => { const v = e.target.dataset.v; if (v) { S.theme = v; saveS(); paintSettings(); } };
  $('#s-accent').onclick = (e) => { const v = e.target.dataset.v; if (v) { S.accent = v; saveS(); paintSettings(); } };
  $('#s-speed').oninput = (e) => { S.speed = +e.target.value; saveS(); };
  $('#s-scroll').oninput = (e) => { S.scroll = +e.target.value; saveS(); };
  $('#s-natural').onclick = () => { S.natural = !S.natural; saveS(); paintSettings(); };
  $('#s-haptics').onclick = () => { S.haptics = !S.haptics; saveS(); paintSettings(); buzz(); };
  paintSettings();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') paintSettings(); });

  // ---------- saved computers
  let comps = store.get('or_comps', []);
  let cur = store.get('or_cur', 0);
  const saveC = () => { store.set('or_comps', comps); store.set('or_cur', cur); };
  function addComputer(base, token, name, select) {
    let i = comps.findIndex((c) => c.base === base);
    if (i < 0) { comps.push({ base, token, name: name || base.replace(/^https?:\/\//, '') }); i = comps.length - 1; }
    else { comps[i].token = token; if (name) comps[i].name = name; }
    if (select) cur = i;
    saveC();
  }
  function parseLink(text) {
    try { const u = new URL(text.trim()); const t = u.searchParams.get('t'); if (t && /^https?:$/.test(u.protocol)) return { base: u.origin, token: t }; } catch {}
    return null;
  }
  const qs = new URLSearchParams(location.search);
  if (qs.get('t')) { addComputer(location.origin, qs.get('t'), null, true); history.replaceState(null, '', location.pathname); }
  // Pairing is optional: opened straight from the PC (no token in the link), just connect to this server.
  if (!comps.some((c) => c.base === location.origin)) addComputer(location.origin, '', null, true);
  if (cur >= comps.length) cur = 0;

  // ---------- PWA: manifest (carries the token so a home-screen copy can pair), service worker, install help
  (function pwa() {
    const c = comps[cur];
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = '/manifest.webmanifest' + (c && c.base === location.origin && c.token ? '?t=' + encodeURIComponent(c.token) : '');
    document.head.appendChild(l);
    if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('/sw.js').catch(() => {});
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const help = $('#installhelp');
    if (standalone) help.textContent = 'Running as an installed app.';
    else if (ios) help.textContent = 'In Safari tap Share, then Add to Home Screen. It opens full screen, already paired.';
    else if (window.isSecureContext) help.textContent = 'Use your browser menu: Install app, or tap Install below.';
    else help.textContent = 'Browser menu, Add to Home screen. This page is plain HTTP, so Chrome only makes a shortcut. For a full-screen install on Android, open chrome://flags, enable "Insecure origins treated as secure" and add ' + location.origin + '.';
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      const b = $('#installbtn'); b.style.display = '';
      b.onclick = () => { e.prompt(); };
    });
  })();

  // ---------- connection
  let ws = null, retry = 0, timer = 0, online = false;
  const setOnline = (ok) => { online = ok; $('#dot').classList.toggle('ok', ok); };
  function paintName() { $('#hostname').textContent = comps[cur] ? comps[cur].name : 'Tap to add a computer'; }
  function connect() {
    clearTimeout(timer);
    if (ws) { ws.onclose = null; ws.onmessage = null; try { ws.close(); } catch {} ws = null; }
    setOnline(false); paintName();
    const c = comps[cur];
    if (!c) return;
    const sock = new WebSocket(c.base.replace(/^http/, 'ws') + '/ws' + (c.token ? '?t=' + encodeURIComponent(c.token) : ''));
    ws = sock;
    sock.onopen = () => { retry = 0; };
    sock.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.t === 'hello') { c.name = m.host || c.name; saveC(); paintName(); setOnline(true); if (activeTab === 'apps') refreshApps(); }
      else if (m.t === 'clip') gotClip(m.text || '');
      else if (m.t === 'win.list') { winItems = m.items || []; renderWins(); }
      else if (m.t === 'app.list') { appItems = m.items || []; renderApps(); }
    };
    sock.onclose = () => {
      setOnline(false);
      if (retry >= 3) $('#hint').innerHTML = 'Cannot reach the PC.<br>Is the server running and are you on the same Wi-Fi?<br>If pairing is on, scan the QR code again.';
      timer = setTimeout(connect, Math.min(3000, 400 * ++retry));
    };
  }
  const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  setInterval(() => send({ t: 'ping' }), 15000);
  if (navigator.wakeLock) {
    const wl = () => navigator.wakeLock.request('screen').catch(() => {});
    wl(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wl());
  }

  // ---------- computer picker
  function renderList() {
    const list = $('#list'); list.textContent = '';
    comps.forEach((c, i) => {
      const row = document.createElement('div'); row.className = 'comp' + (i === cur ? ' cur' : '');
      row.innerHTML = '<svg class="i"><use href="#i-monitor"/></svg><div class="nm"></div><button class="x" aria-label="Remove"><svg class="i"><use href="#i-x"/></svg></button>';
      row.querySelector('.nm').innerHTML = '<span></span><small></small>';
      row.querySelector('span').textContent = c.name; row.querySelector('small').textContent = c.base.replace(/^https?:\/\//, '');
      row.onclick = (e) => { if (e.target.closest('.x')) return; cur = i; saveC(); closePicker(); connect(); };
      row.querySelector('.x').onclick = () => { comps.splice(i, 1); if (cur >= comps.length) cur = Math.max(0, comps.length - 1); saveC(); renderList(); connect(); };
      list.appendChild(row);
    });
    $('#pickmsg').textContent = comps.length ? '' : 'No computers yet. Scan the QR code shown at http://127.0.0.1:1990/admin on your PC, or tap + and paste its link.';
  }
  const openPicker = () => { renderList(); $('#pickscr').classList.add('show'); };
  const closePicker = () => { $('#pickscr').classList.remove('show'); $('#addbox').classList.remove('show'); };
  $('#picker').onclick = openPicker;
  $('#pback').onclick = closePicker;
  $('#padd').onclick = () => { $('#addbox').classList.toggle('show'); $('#addin').focus(); };
  $('#addbox').onsubmit = (e) => {
    e.preventDefault();
    const p = parseLink($('#addin').value);
    if (!p) { $('#pickmsg').textContent = 'That does not look like a OpenRemote link (it must contain ?t=...).'; return; }
    addComputer(p.base, p.token, null, true); $('#addin').value = ''; closePicker(); connect();
  };

  // ---------- batched pointer output
  let ax = 0, ay = 0, sx = 0, sy = 0, queued = false;
  function flush() {
    queued = false;
    const ix = Math.trunc(ax), iy = Math.trunc(ay);
    if (ix || iy) { ax -= ix; ay -= iy; send({ t: 'move', dx: ix, dy: iy }); }
    const jx = Math.trunc(sx), jy = Math.trunc(sy);
    if (jx || jy) { sx -= jx; sy -= jy; send({ t: 'scroll', dx: jx, dy: jy }); }
  }
  const queue = () => { if (!queued) { queued = true; requestAnimationFrame(flush); } };
  const accel = (d) => d * (S.speed / 10) * (1 + Math.min(Math.abs(d), 30) / 15);

  // ---------- touchpad
  const pad = $('#pad');
  let g = null, lastTap = 0;
  const centroid = (ts) => { let x = 0, y = 0; for (const t of ts) { x += t.clientX; y += t.clientY; } return { x: x / ts.length, y: y / ts.length }; };
  pad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const now = performance.now();
    if (!g) {
      g = { t0: now, moved: 0, max: 0, drag: false };
      if (e.touches.length === 1 && now - lastTap < 320) { g.drag = true; send({ t: 'btn', b: 'left', s: 'down' }); buzz(); }
    }
    g.max = Math.max(g.max, e.touches.length);
    g.last = centroid(e.touches);
  }, { passive: false });
  pad.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!g) return;
    const c = centroid(e.touches), dx = c.x - g.last.x, dy = c.y - g.last.y;
    g.last = c; g.moved += Math.abs(dx) + Math.abs(dy);
    if (e.touches.length >= 2) { const dir = S.natural ? -1 : 1; sy += dir * dy * S.scroll; sx += dir * dx * S.scroll; }
    else { ax += accel(dx); ay += accel(dy); }
    queue();
  }, { passive: false });
  const endTouch = (e) => {
    e.preventDefault();
    if (!g) return;
    if (e.touches.length) { g.last = centroid(e.touches); return; }
    const now = performance.now(), tap = g.moved < 10 && now - g.t0 < 250;
    if (g.drag) { send({ t: 'btn', b: 'left', s: 'up' }); lastTap = 0; }
    else if (tap) { send({ t: 'btn', b: g.max >= 2 ? 'right' : 'left', s: 'click' }); buzz(); lastTap = g.max >= 2 ? 0 : now; }
    g = null;
  };
  pad.addEventListener('touchend', endTouch, { passive: false });
  pad.addEventListener('touchcancel', () => { if (g && g.drag) send({ t: 'btn', b: 'left', s: 'up' }); g = null; });
  // desktop-browser fallback
  pad.addEventListener('mousemove', (e) => { if (e.buttons === 1) { ax += accel(e.movementX); ay += accel(e.movementY); queue(); } });
  pad.addEventListener('mousedown', (e) => { if (e.button === 0 && e.detail === 1) pad._md = performance.now(); });
  pad.addEventListener('mouseup', (e) => { if (e.button === 0 && pad._md && performance.now() - pad._md < 200) send({ t: 'btn', b: 'left', s: 'click' }); });
  pad.addEventListener('wheel', (e) => { e.preventDefault(); sy += e.deltaY; sx += e.deltaX; queue(); }, { passive: false });

  // scroll strip: drag = scroll like a scrollbar; tap an end arrow = one notch
  const strip = $('#strip');
  let sg = null;
  strip.addEventListener('pointerdown', (e) => { strip.setPointerCapture(e.pointerId); sg = { y: e.clientY, moved: 0, y0: e.clientY }; });
  strip.addEventListener('pointermove', (e) => { if (!sg) return; const dy = e.clientY - sg.y; sg.y = e.clientY; sg.moved += Math.abs(dy); sy += dy * S.scroll * 1.5; queue(); });
  const stripEnd = (e) => {
    if (!sg) return;
    if (sg.moved < 6) { const r = strip.getBoundingClientRect(); send({ t: 'scroll', dy: e.clientY < r.top + r.height / 2 ? -120 : 120 }); buzz(); }
    sg = null;
  };
  strip.addEventListener('pointerup', stripEnd);
  strip.addEventListener('pointercancel', () => { sg = null; });

  // mouse buttons: press while held
  $$('[data-btn]').forEach((b) => {
    const up = () => { b.classList.remove('down'); send({ t: 'btn', b: b.dataset.btn, s: 'up' }); };
    b.addEventListener('pointerdown', (e) => { b.setPointerCapture(e.pointerId); b.classList.add('down'); send({ t: 'btn', b: b.dataset.btn, s: 'down' }); buzz(); });
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  });

  // ---------- keys, sticky modifiers
  const mods = new Set();
  function paintMods() {
    $$('[data-mod]').forEach((b) => b.classList.toggle('on', mods.has(b.dataset.mod)));
    const pill = $('#modpill'); pill.style.display = mods.size ? 'block' : 'none'; pill.textContent = [...mods].join('+') + '+';
  }
  const sendKey = (k) => { send({ t: 'key', k: [...mods, k].join('+') }); if (mods.size) { mods.clear(); paintMods(); } };
  const typed = (s) => { if (mods.size && s.length === 1) sendKey(s.toLowerCase()); else send({ t: 'text', v: s }); };
  $$('[data-mod]').forEach((b) => { b.onclick = () => { const m = b.dataset.mod; mods.has(m) ? mods.delete(m) : mods.add(m); paintMods(); buzz(); }; });
  $('#modpill').onclick = () => { mods.clear(); paintMods(); };

  // generic key buttons, with hold-to-repeat for [data-repeat]
  function bindPress(el, fn, repeat) {
    let t1 = 0, t2 = 0;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); fn(); buzz();
      if (repeat) { t1 = setTimeout(() => { t2 = setInterval(fn, 55); }, 350); }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((n) => el.addEventListener(n, stop));
  }
  $$('[data-key]').forEach((b) => bindPress(b, () => sendKey(b.dataset.key), b.hasAttribute('data-repeat')));
  $$('[data-t]').forEach((b) => bindPress(b, () => typed(b.dataset.t), false));
  const frow = $('#frow');
  [...Array(12).keys()].map((i) => 'f' + (i + 1)).concat(['printscreen', 'capslock', 'numlock', 'pause']).forEach((k) => {
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.length <= 3 ? k.toUpperCase() : { printscreen: 'PrtSc', capslock: 'Caps', numlock: 'Num', pause: 'Pause' }[k];
    bindPress(b, () => sendKey(k), false); frow.appendChild(b);
  });

  // ---------- on-screen QWERTY
  const LAYOUTS = {
    abc: ['qwertyuiop'.split(''), 'asdfghjkl'.split(''), ['shift', ...'zxcvbnm'.split(''), 'bksp']],
    num: ['1234567890'.split(''), ['-', '/', ':', ';', '(', ')', '$', '&', '@', '"'], ['sym', '.', ',', '?', '!', "'", 'bksp']],
    sym: [['[', ']', '{', '}', '#', '%', '^', '*', '+', '='], ['_', '\\', '|', '~', '<', '>', '€', '£', '¥', '•'], ['num', '.', ',', '?', '!', "'", 'bksp']],
  };
  let layout = 'abc', shift = false, caps = false, lastShift = 0;
  const kbdEl = $('#p-kbd');
  const LABEL = { shift: '⇧', bksp: '⌫', num: '123', abc: 'ABC', sym: '#+=' };
  function buildKbd() {
    kbdEl.textContent = '';
    const rows = LAYOUTS[layout].map((r) => r.slice());
    const bottom = [layout === 'abc' ? 'num' : 'abc', 'sys', 'space', 'enter'];
    const all = rows.concat([bottom]);
    all.forEach((row) => {
      const r = document.createElement('div'); r.className = 'krow';
      if (row === rows[1] && layout === 'abc') r.style.padding = '0 5%';
      row.forEach((k) => {
        const b = document.createElement('button'); b.className = 'k';
        if (k === 'shift' || k === 'bksp') b.classList.add('w15');
        if (k === 'num' || k === 'abc' || k === 'sym') { b.classList.add('w14', 'small'); }
        if (k === 'sys') { b.classList.add('w14'); b.innerHTML = '<svg class="i"><use href="#i-web"/></svg>'; }
        else if (k === 'space') { b.classList.add('w5'); b.setAttribute('aria-label', 'Space'); }
        else if (k === 'enter') { b.classList.add('w2', 'small'); b.textContent = 'return'; }
        else if (LABEL[k]) { b.textContent = LABEL[k]; if (k === 'shift' && (shift || caps)) b.classList.add('on'); }
        else b.textContent = layout === 'abc' && (shift || caps) ? k.toUpperCase() : k;
        bindPress(b, () => press(k), k === 'bksp');
        r.appendChild(b);
      });
      kbdEl.appendChild(r);
    });
  }
  function press(k) {
    if (k === 'shift') { const n = performance.now(); if (n - lastShift < 350) { caps = !caps; shift = caps; } else { shift = !shift; caps = false; } lastShift = n; buildKbd(); return; }
    if (k === 'num' || k === 'abc' || k === 'sym') { layout = k; buildKbd(); return; }
    if (k === 'sys') { $('#kb').focus(); return; }
    if (k === 'bksp') return sendKey('backspace');
    if (k === 'enter') return sendKey('enter');
    if (k === 'space') return sendKey('space');
    typed(layout === 'abc' && (shift || caps) ? k.toUpperCase() : k);
    if (shift && !caps) { shift = false; buildKbd(); }
  }
  buildKbd();

  // hidden textarea: system keyboard (emoji, other languages, swipe typing)
  const kb = $('#kb');
  let composing = false;
  const specials = { Backspace: 'backspace', Enter: 'enter', Tab: 'tab', Escape: 'esc', ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Delete: 'delete' };
  kb.addEventListener('keydown', (e) => { if (specials[e.key] && !e.isComposing) { e.preventDefault(); sendKey(specials[e.key]); } });
  kb.addEventListener('beforeinput', (e) => {
    if (e.isComposing) return;
    if (e.inputType === 'insertText' && e.data) { e.preventDefault(); typed(e.data); }
    else if (e.inputType === 'deleteContentBackward') { e.preventDefault(); sendKey('backspace'); }
    else if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') { e.preventDefault(); sendKey('enter'); }
  });
  kb.addEventListener('compositionstart', () => { composing = true; });
  kb.addEventListener('compositionend', (e) => { composing = false; if (e.data) typed(e.data); kb.value = ''; });
  kb.addEventListener('input', () => { if (!composing) kb.value = ''; });

  // ---------- web panel
  $('#urlform').onsubmit = (e) => {
    e.preventDefault();
    let u = $('#urlin').value.trim(); if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    send({ t: 'open', url: u }); $('#urlin').value = '';
  };

  // ---------- clipboard panel
  const clipText = $('#cliptext'), clipMsg = $('#clipmsg');
  const say = (m) => { clipMsg.textContent = m; };
  $('#clipsend').onclick = () => { if (!clipText.value) return say('Nothing to send.'); send({ t: 'clip.set', text: clipText.value }); say('Sent to the computer clipboard.'); buzz(); };
  $('#clipto').onclick = async () => {
    try { if (navigator.clipboard && navigator.clipboard.readText) { clipText.value = await navigator.clipboard.readText(); } } catch {}
    if (clipText.value) { send({ t: 'clip.set', text: clipText.value }); say('Sent to the computer clipboard.'); buzz(); }
    else { say('Paste or type your text above, then tap Send.'); clipText.focus(); }
  };
  $('#clipfrom').onclick = () => { say('Asking the computer...'); send({ t: 'clip.get' }); };
  function gotClip(text) {
    clipText.value = text;
    if (!text) return say('The computer clipboard has no text.');
    let ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); ok = true; } } catch {}
    if (!ok) { try { clipText.focus(); clipText.select(); ok = document.execCommand('copy'); } catch {} }
    say(ok ? 'Copied to your phone clipboard.' : 'Received. Long-press the text to copy it.');
  }

  // ---------- power panel (tap twice to confirm, except Lock)
  $$('[data-power]').forEach((b) => {
    let armTimer = 0; const label = b.querySelector('span'), orig = label.textContent;
    b.onclick = () => {
      const a = b.dataset.power;
      if (a === 'lock' || b.classList.contains('arm')) { send({ t: 'power', a }); b.classList.remove('arm'); label.textContent = orig; clearTimeout(armTimer); buzz(); return; }
      b.classList.add('arm'); label.textContent = 'Tap again to confirm';
      armTimer = setTimeout(() => { b.classList.remove('arm'); label.textContent = orig; }, 3000);
    };
  });

  // ---------- apps: window switcher + launcher
  let activeTab = '', appsMode = 'open', winItems = [], appItems = [], appsLoaded = false;
  const iconUrl = (key) => {
    const c = comps[cur];
    return key && c ? c.base + '/icon/' + key + '.png' + (c.token ? '?t=' + encodeURIComponent(c.token) : '') : '';
  };
  function iconImg(key) {
    const img = document.createElement('img');
    img.loading = 'lazy'; img.alt = '';
    const u = iconUrl(key);
    if (u) img.src = u; else img.style.visibility = 'hidden';
    img.onerror = () => { img.style.visibility = 'hidden'; };
    return img;
  }
  function svgIcon(name) {
    const NS = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'i');
    const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#i-' + name); s.appendChild(u);
    return s;
  }
  function refreshApps() {
    if (appsMode === 'open') send({ t: 'win.list' });
    else if (!appsLoaded) { appsLoaded = true; send({ t: 'app.list' }); }
  }
  function renderWins() {
    const box = $('#winlist'); box.textContent = '';
    winItems.forEach((w) => {
      const row = document.createElement('div');
      row.className = 'win' + (w.foreground ? ' fg' : '') + (w.minimized ? ' min' : ''); row.dataset.id = w.id;
      const ti = document.createElement('div'); ti.className = 'ti';
      const b = document.createElement('b'); b.textContent = w.title;           // titles are untrusted: text only
      const sm = document.createElement('small'); sm.textContent = w.exe || '';
      ti.append(b, sm);
      const acts = document.createElement('div'); acts.className = 'acts';
      [['min', 'min', 'Minimize'], [w.minimized ? 'restore' : 'max', w.minimized ? 'restore' : 'max', w.minimized ? 'Restore' : 'Maximize'], ['close', 'x', 'Close']].forEach(([a, icon, label]) => {
        const btn = document.createElement('button'); btn.dataset.a = a; btn.setAttribute('aria-label', label);
        if (a === 'close') btn.className = 'x';
        btn.appendChild(svgIcon(icon)); acts.appendChild(btn);
      });
      row.append(iconImg(w.icon), ti, acts); box.appendChild(row);
    });
    $('#appsmsg').textContent = appsMode === 'open' ? (winItems.length ? '' : 'No windows found.') : $('#appsmsg').textContent;
  }
  function renderApps() {
    const grid = $('#appgrid'); grid.textContent = '';
    const q = $('#appsearch').value.trim().toLowerCase();
    const items = appItems.filter((a) => !q || a.name.toLowerCase().includes(q));
    items.forEach((a) => {
      const cell = document.createElement('button'); cell.className = 'app'; cell.dataset.id = a.id; cell.dataset.name = a.name;
      const span = document.createElement('span'); span.textContent = a.name;
      cell.append(iconImg(a.icon), span); grid.appendChild(cell);
    });
    $('#appsmsg').textContent = appsMode === 'all' ? (items.length ? '' : (appItems.length ? 'No match.' : 'Loading...')) : $('#appsmsg').textContent;
  }
  function setAppsMode(mode) {
    appsMode = mode;
    $$('#apps-mode button').forEach((b) => b.classList.toggle('on', b.dataset.v === mode));
    $('#winlist').hidden = mode !== 'open'; $('#appgrid').hidden = mode !== 'all'; $('#appsearch').hidden = mode !== 'all';
    $('#appsmsg').textContent = '';
    if (mode === 'open') renderWins(); else renderApps();
    refreshApps();
  }
  $('#apps-mode').onclick = (e) => { const v = e.target.dataset && e.target.dataset.v; if (v) setAppsMode(v); };
  $('#appsearch').oninput = renderApps;
  $('#winlist').onclick = (e) => {
    const row = e.target.closest('.win'); if (!row) return;
    const act = e.target.closest('button[data-a]');
    send({ t: 'win.act', id: Number(row.dataset.id), a: act ? act.dataset.a : 'focus' });
    buzz(); setTimeout(() => send({ t: 'win.list' }), 450);
  };
  $('#appgrid').onclick = (e) => {
    const cell = e.target.closest('.app'); if (!cell) return;
    send({ t: 'app.launch', id: cell.dataset.id }); buzz();
    $('#appsmsg').textContent = 'Launching ' + cell.dataset.name + '...';
    // show it in the open-windows view once it has had time to appear
    setTimeout(() => { if (activeTab === 'apps') setAppsMode('open'); }, 1400);
  };
  setInterval(() => { if (activeTab === 'apps' && appsMode === 'open' && online && !document.hidden) send({ t: 'win.list' }); }, 3000);

  // ---------- tabs
  const TABS = [['set', 'menu', 'Settings'], ['kbd', 'kbd', 'Keyboard'], ['remote', 'remote', 'Media remote'], ['apps', 'apps', 'Apps'], ['web', 'web', 'Browser'], ['keys', 'fn', 'Special keys'], ['clip', 'clip', 'Clipboard'], ['power', 'power', 'Power']];
  const tabsEl = $('#tabs');
  TABS.forEach(([id, icon, label]) => {
    const b = document.createElement('button'); b.dataset.tab = id; b.setAttribute('aria-label', label);
    b.innerHTML = `<svg class="i"><use href="#i-${icon}"/></svg>`;
    b.onclick = () => showTab(id); tabsEl.appendChild(b);
  });
  function showTab(id) {
    activeTab = id;
    if (id === 'apps') refreshApps();
    $$('.pane').forEach((p) => { p.hidden = p.id !== 'p-' + id; });
    $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === id));
    store.set('or_tab', id);
  }
  showTab(TABS.some((t) => t[0] === store.get('or_tab', 'kbd')) ? store.get('or_tab', 'kbd') : 'kbd');

  paintName();
  if (!comps.length) openPicker(); else connect();
})();
</script>
