<!doctype html>
<html lang="en" class="mocha" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OpenRemote">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>OpenRemote</title>
<script>
// Pick the Catppuccin flavor and accent before first paint (same rules as paintSettings in app.js).
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('or_settings') || '{}'), t = s.theme || 'auto';
    var map = { light: 'latte', dark: 'mocha' }; t = map[t] || t;
    var f = ['latte', 'frappe', 'macchiato', 'mocha'].indexOf(t) >= 0 ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte');
    document.documentElement.className = f;
    var a = { purple: 'mauve', orange: 'peach' }[s.accent] || s.accent;
    if (a) document.documentElement.dataset.accent = a;
  } catch (e) {}
})();
</script>
